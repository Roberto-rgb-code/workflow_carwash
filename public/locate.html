<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Ubicación del auto · Car Wash Pro</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0b1f2a;
      --foam: #f2f8fb;
      --accent: #00a3c4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Manrope, sans-serif;
      color: var(--foam);
      background: #06131a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.1rem .75rem;
      background: linear-gradient(180deg, #0b1f2a, #0b1f2aee);
    }
    h1 {
      font-family: "Bebas Neue", sans-serif;
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: .03em;
    }
    .sub { margin: .35rem 0 0; opacity: .75; font-size: .9rem; }
    #map {
      flex: 1;
      min-height: 55vh;
      width: 100%;
    }
    .panel {
      padding: 1rem 1.1rem 1.4rem;
      background: #0b1f2a;
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .coords { font-size: .8rem; opacity: .65; margin-bottom: .8rem; }
    button {
      width: 100%;
      border: 0;
      border-radius: .4rem;
      padding: .95rem 1rem;
      font-weight: 700;
      font-family: inherit;
      font-size: 1rem;
      background: var(--accent);
      color: #031015;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .msg { margin-top: .75rem; font-size: .9rem; min-height: 1.2em; }
    .ok { color: #6dffb0; }
    .err { color: #ff8d7a; }
  </style>
</head>
<body>
  <header>
    <h1>Marca tu auto</h1>
    <p class="sub">Mueve el pin al lugar aproximado donde está estacionado.</p>
  </header>
  <div id="map"></div>
  <div class="panel">
    <div class="coords" id="coords">Arrastra el marcador…</div>
    <button id="save" disabled>Confirmar ubicación</button>
    <div class="msg" id="msg"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const token = location.pathname.split('/').pop();
    const coordsEl = document.getElementById('coords');
    const saveBtn = document.getElementById('save');
    const msg = document.getElementById('msg');

    let lat = 20.6767;
    let lng = -103.3475;
    let map, marker;

    function setCoords(a, b) {
      lat = a; lng = b;
      coordsEl.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
      saveBtn.disabled = false;
    }

    async function init() {
      try {
        const res = await fetch(`/public/orders/${token}`);
        if (!res.ok) throw new Error('Pedido no encontrado');
        const order = await res.json();
        if (order.lat != null && order.lng != null) {
          lat = order.lat; lng = order.lng;
        }
      } catch (e) {
        msg.className = 'msg err';
        msg.textContent = e.message || 'No se pudo cargar el pedido';
      }

      map = L.map('map').setView([lat, lng], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      marker = L.marker([lat, lng], { draggable: true }).addTo(map);
      setCoords(lat, lng);

      marker.on('dragend', () => {
        const p = marker.getLatLng();
        setCoords(p.lat, p.lng);
      });
      map.on('click', (e) => {
        marker.setLatLng(e.latlng);
        setCoords(e.latlng.lat, e.latlng.lng);
      });

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          const { latitude, longitude } = pos.coords;
          marker.setLatLng([latitude, longitude]);
          map.setView([latitude, longitude], 17);
          setCoords(latitude, longitude);
        });
      }
    }

    saveBtn.addEventListener('click', async () => {
      saveBtn.disabled = true;
      msg.className = 'msg';
      msg.textContent = 'Guardando…';
      try {
        const res = await fetch(`/public/orders/${token}/location`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lat, lng }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al guardar');
        msg.className = 'msg ok';
        msg.textContent = data.coverageOk
          ? 'Ubicación guardada. Ya puedes volver a WhatsApp.'
          : 'Ubicación guardada (fuera de cobertura). Vuelve a WhatsApp.';
      } catch (e) {
        msg.className = 'msg err';
        msg.textContent = e.message || 'Error';
        saveBtn.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
